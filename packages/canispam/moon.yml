# https://moonrepo.dev/docs/config/tasks
$schema: 'https://moonrepo.dev/schemas/project.json'

tasks:
  build:
    deps:
      - ~:copy.classifier

  compile:
    outputs:
      - dist

  copy.classifier:
    command: cp src/classifier/spamscanner-classifier.json dist/classifier/spamscanner-classifier.json
    options:
      cache: false

  test:
    command: vitest --config vitest.config.ts
    deps:
      - ~:build
    inputs:
      - src
      - test
      - package.json
    env:
      FORCE_COLOR: '1'
    options:
      cache: false
      outputStyle: 'stream'
